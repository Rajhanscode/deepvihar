<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Vihar AI Assistant</title>
    <!-- Linking to your main style file -->
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax for Math Formulas -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="ai-page-body">

    <!-- Minimal Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo-text">
                <img src="logo.jpeg" alt="Logo">
                Deep Vihar
            </a>
            <a href="index.html" class="btn back-btn" style="padding: 8px 16px; font-size: 14px;">
                <i class="fas fa-arrow-left"></i> <span class="back-text">Back to Home</span>
            </a>
        </div>
    </nav>

    <!-- Main AI Chat UI -->
    <div class="ai-chat-container">
        <div class="ai-chat-header">
            <h2><i class="fas fa-robot"></i> Deep Vihar AI</h2>
            <p>Ask anything about courses, syllabus, or doubts.</p>
        </div>
        
        <div class="ai-chat-messages" id="ai-chat-messages">
            <!-- Initial AI Greeting Message -->
            <div class="chat-message ai-message">
                Hello! I am the Deep Vihar AI Assistant. How can I help you today?
            </div>
        </div>
        
        <div class="ai-chat-input-area">
            <input type="text" id="ai-chat-input" placeholder="Type your question here..." autocomplete="off">
            <button id="ai-chat-send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Separate JS logic for AI page -->
    <script src="ai-script.js"></script>
</body>
</html>
